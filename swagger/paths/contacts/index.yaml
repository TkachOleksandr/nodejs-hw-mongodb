get:
  tags:
    - Contacts
  summary: Отримати всі контакти
  operationId: getAllContacts
  description: Повертає список контактів з підтримкою фільтрації, пагінації та сортування
  security:
    - bearerAuth: []
  parameters:
    - name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    - name: favorite
      in: query
      required: false
      schema:
        type: boolean
    - name: sortBy
      in: query
      required: false
      schema:
        type: string
    - name: sortOrder
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
  responses:
    '200':
      description: Список контактів з пагінацією
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              code:
                type: integer
                example: 200
              message:
                type: string
                example: Контакти отримано
              data:
                type: object
                properties:
                  contacts:
                    type: array
                    items:
                      $ref: ../../components/schemas/Contact.yaml#/Contact
                  total:
                    type: integer
                    description: Загальна кількість контактів
                  page:
                    type: integer
                    description: Номер поточної сторінки
                  limit:
                    type: integer
                    description: Ліміт контактів на сторінку
                required:
                  - contacts
                  - total
                  - page
                  - limit
            required:
              - status
              - code
              - message
              - data
    '401':
      description: Неавторизований доступ
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/Error.yaml#/Error

post:
  tags:
    - Contacts
  summary: Створити новий контакт
  operationId: createContact
  description: Додає новий контакт до бази даних
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required:
            - name
            - email
            - phone
          properties:
            name:
              type: string
            email:
              type: string
            phone:
              type: string
            favorite:
              type: boolean
            image:
              type: string
              format: binary
        encoding:
          image:
            contentType: image/jpeg, image/png
  responses:
    '201':
      description: Контакт створено
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              code:
                type: integer
                example: 201
              message:
                type: string
                example: Контакт створено
              data:
                $ref: ../../components/schemas/Contact.yaml#/Contact
            required:
              - status
              - code
              - message
              - data
    '400':
      description: Помилка валідації
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/Error.yaml#/Error
    '401':
      description: Неавторизований доступ
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/Error.yaml#/Error
