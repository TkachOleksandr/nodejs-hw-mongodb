tags:
  - Contacts
summary: Get list of contacts
operationId: getContacts
description: Returns paginated list of contacts
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    description: Page number
    required: false
    schema:
      type: integer
  - name: limit
    in: query
    description: Number of items per page
    required: false
    schema:
      type: integer
  - name: favorite
    in: query
    description: Filter by favorite
    required: false
    schema:
      type: boolean
responses:
  '200':
    description: List of contacts
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../components/schemas/Contact.yaml'
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/Error.yaml'
