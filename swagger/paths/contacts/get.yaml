tags:
  - Contacts
summary: Get all user contacts
operationId: getAllContacts
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    description: Номер сторінки (за замовчуванням 1)
    required: false
    schema:
      type: integer
      default: 1
  - name: limit
    in: query
    description: Кількість контактів на сторінці (за замовчуванням 20)
    required: false
    schema:
      type: integer
      default: 20
  - name: favorite
    in: query
    description: Фільтр за улюбленими контактами
    required: false
    schema:
      type: boolean
  - name: sortBy
    in: query
    description: Сортувати за полем (наприклад name)
    required: false
    schema:
      type: string
  - name: sortByDesc
    in: query
    description: Сортувати за полем у спадному порядку (наприклад email)
    required: false
    schema:
      type: string
  - name: filter
    in: query
    description: Виводити лише вказані поля, розділені |
    required: false
    schema:
      type: string
      example: name|email
responses:
  '200':
    $ref: '../../components/responses/contactsResponse.yaml'
  '404':
    $ref: '../../components/responses/errorResponse.yaml'
