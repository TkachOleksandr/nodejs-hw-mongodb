tags:
  - Contacts
summary: Delete contact by ID
operationId: deleteContact
description: Deletes a contact by ID
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
responses:
  '200':
    description: Contact deleted
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: Contact deleted
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/Error.yaml'
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/Error.yaml'
