delete:
  tags:
    - Contacts
  summary: Delete contact by ID
  operationId: deleteContact
  security:
    - bearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      description: ID контакту, який потрібно видалити
      schema:
        type: string
  responses:
    '200':
      description: Контакт успішно видалено
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              code:
                type: integer
                example: 200
              message:
                type: string
                example: Contact deleted successfully
              data:
                type: 'null'
                example: null
    '401':
      $ref: '../../../components/responses/Unauthorized.yaml'
    '404':
      $ref: '../../../components/responses/NotFound.yaml'
