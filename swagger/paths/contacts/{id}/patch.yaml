patch:
  tags:
    - Contacts
  summary: Оновити контакт
  operationId: updateContact
  description: Оновлює дані конкретного контакту за ID
  security:
    - bearerAuth: []
  parameters:
    - name: contactId
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
            phone:
              type: string
            favorite:
              type: boolean
  responses:
    '200':
      description: Контакт оновлено
    '400':
      description: Невірний запит
    '404':
      description: Контакт не знайдено
