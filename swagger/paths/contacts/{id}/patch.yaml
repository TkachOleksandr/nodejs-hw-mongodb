patch:
  tags:
    - Contacts
  summary: Update a contact by ID
  operationId: updateContactById
  security:
    - bearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      description: ID of the contact to update
      schema:
        type: string
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            name:
              type: string
              example: Jane Doe
            email:
              type: string
              format: email
              example: jane@example.com
            phone:
              type: string
              example: +380501234567
            favorite:
              type: boolean
              example: true
            avatar:
              type: string
              format: binary
              description: New avatar image
  responses:
    '200':
      description: Contact updated successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              code:
                type: integer
                example: 200
              message:
                type: string
                example: Contact updated successfully
              data:
                type: object
                properties:
                  contact:
                    $ref: '../../../components/schemas/Contact.yaml'
    '400':
      $ref: '../../../components/responses/BadRequest.yaml'
    '401':
      $ref: '../../../components/responses/Unauthorized.yaml'
    '404':
      $ref: '../../../components/responses/NotFound.yaml'
