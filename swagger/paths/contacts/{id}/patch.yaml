tags:
  - Contacts
summary: Update contact by ID
operationId: updateContact
description: Updates a contact with given fields
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../../components/schemas/ContactInput.yaml'
responses:
  '200':
    description: Contact updated
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/Contact.yaml'
  '400':
    description: Invalid input
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/Error.yaml'
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/Error.yaml'
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/Error.yaml'
