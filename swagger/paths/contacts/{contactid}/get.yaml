get:
  tags:
    - Contacts
  summary: Отримати контакт за ID
  operationId: getContactById
  description: Отримати деталі одного контакту за його ID
  security:
    - bearerAuth: []
  parameters:
    - name: contactId
      in: path
      required: true
      description: Унікальний ідентифікатор контакту
      schema:
        type: string
  responses:
    '200':
      description: Контакт знайдено
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              code:
                type: integer
                example: 200
              message:
                type: string
                example: Контакт знайдено
              data:
                $ref: ../../components/schemas/Contact.yaml#/Contact
            required:
              - status
              - code
              - message
              - data
    '404':
      description: Контакт не знайдено
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: error
              code:
                type: integer
                example: 404
              message:
                type: string
                example: Контакт не знайдено
              data:
                type: string
                example: ''
            required:
              - status
              - code
              - message
              - data
