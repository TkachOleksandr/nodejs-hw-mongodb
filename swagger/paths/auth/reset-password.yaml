post:
  tags:
    - Auth
  summary: Оновлення паролю користувача по токену
  operationId: resetPassword
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            token:
              type: string
            password:
              type: string
  responses:
    '200':
      description: Пароль оновлено
    '400':
      description: Невірний запит
