tags:
  - Auth
summary: User logout
operationId: logoutUser
description: Logout user and invalidate refresh token
security:
  - bearerAuth: []
responses:
  '204':
    description: Logout successful, no content
  '401':
    description: Unauthorized, invalid or missing token
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/Error.yaml'
