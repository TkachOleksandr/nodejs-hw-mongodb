responses:
  '201':
    description: User successfully registered
    content:
      application/json:
        schema:
          type: object
          properties:
            email:
              type: string
              example: user@example.com
            subscription:
              type: string
              example: free
  '400':
    description: Bad request, validation failed
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/Error.yaml'
  '409':
    description: Email already in use
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/Error.yaml'
