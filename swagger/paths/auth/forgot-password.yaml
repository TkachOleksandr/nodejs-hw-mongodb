tags:
  - Auth
summary: Request password reset
operationId: forgotPassword
description: Send email with password reset link
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          email:
            type: string
            format: email
            example: user@example.com
        required:
          - email
responses:
  '200':
    description: Email sent if user exists
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: Password reset email sent
  '400':
    description: Validation error
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/Error.yaml'
