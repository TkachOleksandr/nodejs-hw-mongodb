tags:
  - Auth
summary: User login
operationId: loginUser
description: Login user and receive JWT tokens
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          email:
            type: string
            format: email
            example: user@example.com
          password:
            type: string
            format: password
            example: StrongPass123
        required:
          - email
          - password
responses:
  '200':
    description: Login successful, tokens returned
    content:
      application/json:
        schema:
          type: object
          properties:
            accessToken:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            refreshToken:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
  '400':
    description: Missing fields or validation error
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/Error.yaml'
  '401':
    description: Invalid credentials
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/Error.yaml'
