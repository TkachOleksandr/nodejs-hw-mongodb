description: Successful operation with contacts list
content:
  application/json:
    schema:
      type: object
      properties:
        status:
          type: string
          example: 'success'
        code:
          type: integer
          example: 200
        data:
          type: object
          properties:
            total:
              type: integer
              example: 100
              description: Total number of contacts
            page:
              type: integer
              example: 1
              description: Current page number
            limit:
              type: integer
              example: 20
              description: Number of items per page
            contacts:
              type: array
              items:
                $ref: '../schemas/Contact.yaml'
          required:
            - total
            - page
            - limit
            - contacts
