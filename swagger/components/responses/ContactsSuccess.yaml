description: List of contacts response with pagination
content:
  application/json:
    schema:
      type: object
      properties:
        status:
          type: string
          example: success
        code:
          type: integer
          example: 200
        message:
          type: string
          example: Contacts fetched successfully
        data:
          type: object
          properties:
            contacts:
              type: array
              items:
                $ref: '../schemas/Contact.yaml'
            total:
              type: integer
              example: 45
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 10
