description: Single contact response
content:
  application/json:
    schema:
      type: object
      properties:
        status:
          type: string
          example: success
        code:
          type: integer
          example: 200
        message:
          type: string
          example: Contact fetched successfully
        data:
          type: object
          properties:
            contact:
              $ref: '../schemas/Contact.yaml'
