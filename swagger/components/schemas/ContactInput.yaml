type: object
properties:
  name:
    type: string
    example: John Doe
  email:
    type: string
    format: email
    example: john@example.com
  phone:
    type: string
    example: +380501234567
  favorite:
    type: boolean
    example: true
  avatar:
    type: string
    format: binary
required:
  - name
  - email
  - phone
