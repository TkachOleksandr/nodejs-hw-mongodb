openapi: 3.0.3
info:
  version: 1.0.0
  title: Contacts API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: REST API для керування контактами з авторизацією, email та зображеннями

tags:
  - name: Contacts
    description: Операції з контактами
  - name: Auth
    description: Операції авторизації

servers:
  - url: http://localhost:3000
  - url: https://nodejs-hw-mongodb-1-lacz.onrender.com

paths:
  /contacts:
    get:
      tags:
        - Contacts
      summary: Отримати всі контакти
      operationId: getAllContacts
      description: Повертає список контактів з підтримкою фільтрації, пагінації та сортування
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: favorite
          in: query
          required: false
          schema:
            type: boolean
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
        - name: sortOrder
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: Список контактів з пагінацією
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - code
                  - message
                  - data
                properties:
                  status:
                    type: string
                    example: success
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Контакти отримано
                  data:
                    type: object
                    required:
                      - contacts
                      - total
                      - page
                      - limit
                      - totalPages
                    properties:
                      contacts:
                        type: array
                        items:
                          $ref: '#/components/schemas/Contact'
                      total:
                        type: integer
                        description: Загальна кількість контактів
                      page:
                        type: integer
                        description: Номер поточної сторінки
                      limit:
                        type: integer
                        description: Ліміт контактів на сторінку
                      totalPages:
                        type: integer
                        description: Загальна кількість сторінок
        '401':
          description: Неавторизований доступ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Contacts
      summary: Створити новий контакт
      operationId: createContact
      description: Додає новий контакт до бази даних
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - email
                - phone
              properties:
                name:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                favorite:
                  type: boolean
                photo:
                  type: string
                  format: binary
            encoding:
              photo:
                contentType: 'image/jpeg, image/png'
      responses:
        '201':
          description: Контакт створено
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - code
                  - message
                  - data
                properties:
                  status:
                    type: string
                    example: success
                  code:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: Контакт створено
                  data:
                    $ref: '#/components/schemas/Contact'
        '400':
          description: Помилка валідації
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Неавторизований доступ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contacts/{contactId}:
    parameters:
      - name: contactId
        in: path
        required: true
        schema:
          type: string

    get:
      summary: Отримати контакт за ID
      tags:
        - Contacts
      operationId: getContactById
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Контакт знайдено
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - code
                  - message
                  - data
                properties:
                  status:
                    type: string
                    example: success
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Контакт отримано
                  data:
                    $ref: '#/components/schemas/Contact'
        '404':
          description: Контакт не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      summary: Оновити контакт за ID
      tags:
        - Contacts
      operationId: updateContactById
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                favorite:
                  type: boolean
                photo:
                  type: string
                  format: binary
            encoding:
              photo:
                contentType: 'image/jpeg, image/png'
      responses:
        '200':
          description: Контакт оновлено
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - code
                  - message
                  - data
                properties:
                  status:
                    type: string
                    example: success
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Контакт оновлено
                  data:
                    $ref: '#/components/schemas/Contact'
        '404':
          description: Контакт не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Видалити контакт за ID
      tags:
        - Contacts
      operationId: deleteContactById
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Контакт видалено
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - code
                  - message
                  - data
                properties:
                  status:
                    type: string
                    example: success
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Контакт видалено
                  data:
                    $ref: '#/components/schemas/Contact'
        '404':
          description: Контакт не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    Contact:
      type: object
      required:
        - _id
        - name
        - email
        - phone
        - favorite
      properties:
        _id:
          type: string
          example: 64a4f2bc7d5f9a1c2e8b4567
        name:
          type: string
          example: John Doe
        email:
          type: string
          example: john.doe@example.com
        phone:
          type: string
          example: '+1234567890'
        favorite:
          type: boolean
          example: false
        photo:
          type: string
          format: uri
          example: 'https://res.cloudinary.com/demo/image/upload/sample.jpg'

    Error:
      type: object
      required:
        - status
        - code
        - message
      properties:
        status:
          type: string
          example: error
        code:
          type: integer
          example: 404
        message:
          type: string
          example: Not found
