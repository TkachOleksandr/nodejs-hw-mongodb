openapi: 3.0.3
info:
  version: 1.0.0
  title: Contacts API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: REST API для керування контактами з авторизацією, email та зображеннями

tags:
  - name: Contacts
    description: Операції з контактами
  - name: Auth
    description: Операції авторизації

servers:
  - url: http://localhost:3000
  - url: https://nodejs-hw-mongodb-1-lacz.onrender.com

paths:
  /contacts:
    $ref: ../swagger/paths/contacts/index.yaml

  /contacts/{contactId}:
    parameters:
      - name: contactId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Отримати контакт за ID
      tags:
        - Contacts
      operationId: getContactById
      description: Повертає контакт за ID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Контакт знайдено
          content:
            application/json:
              schema:
                $ref: ../swagger/components/schemas/Contact.yaml
        '404':
          description: Контакт не знайдено
          content:
            application/json:
              schema:
                $ref: ../swagger/components/schemas/Error.yaml
    patch:
      summary: Оновити контакт за ID
      tags:
        - Contacts
      operationId: updateContactById
      description: Оновлює контакт
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../swagger/components/schemas/Contact.yaml
      responses:
        '200':
          description: Контакт оновлено
        '404':
          description: Контакт не знайдено
          content:
            application/json:
              schema:
                $ref: ../swagger/components/schemas/Error.yaml
    delete:
      summary: Видалити контакт за ID
      tags:
        - Contacts
      operationId: deleteContactById
      description: Видаляє контакт
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Контакт видалено
        '404':
          description: Контакт не знайдено
          content:
            application/json:
              schema:
                $ref: ../swagger/components/schemas/Error.yaml

  /auth/register:
    $ref: ../swagger/paths/auth/register.yaml

  /auth/login:
    $ref: ../swagger/paths/auth/login.yaml

  /auth/logout:
    $ref: ../swagger/paths/auth/logout.yaml

  /auth/refresh:
    $ref: ../swagger/paths/auth/refresh.yaml

  /auth/forgot-password:
    $ref: ../swagger/paths/auth/forgot-password.yaml

  /auth/reset-password:
    $ref: ../swagger/paths/auth/reset-password.yaml

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    Contact:
      $ref: ../swagger/components/schemas/Contact.yaml
    User:
      $ref: ../swagger/components/schemas/User.yaml
    Error:
      $ref: ../swagger/components/schemas/Error.yaml
