openapi: 3.0.3
info:
  version: 1.0.0
  title: Contacts API
  description: REST API для керування контактами з авторизацією, email та зображеннями
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: https://nodejs-hw-mongodb-1-lacz.onrender.com

tags:
  - name: Contacts
    description: Операції з контактами

paths:
  /contacts:
    get:
      tags:
        - Contacts
      summary: Отримати всі контакти
      operationId: getAllContacts
      description: Повертає список контактів з підтримкою фільтрації, пагінації та сортування
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: favorite
          in: query
          required: false
          schema:
            type: boolean
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
        - name: sortByDesc
          in: query
          required: false
          schema:
            type: string
        - name: filter
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Список контактів
        '401':
          description: Неавторизовано

    post:
      tags:
        - Contacts
      summary: Створити новий контакт
      operationId: createContact
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - email
                - phone
              properties:
                name:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                favorite:
                  type: boolean
                photo:
                  type: string
                  format: binary
            encoding:
              photo:
                contentType: image/jpeg
      responses:
        '201':
          description: Контакт створено
        '400':
          description: Помилка валідації

  /contacts/{contactId}:
    parameters:
      - name: contactId
        in: path
        required: true
        description: Унікальний ідентифікатор контакту
        schema:
          type: string

    get:
      tags:
        - Contacts
      summary: Отримати контакт за ID
      operationId: getContactById
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Контакт знайдено
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
                  code: 200
                  message: Контакт отримано
                  data:
                    _id: 64a4f2bc7d5f9a1c2e8b4567
                    name: John Doe
                    email: john.doe@example.com
                    phone: '+1234567890'
                    favorite: false
                    photo: https://res.cloudinary.com/demo/image/upload/sample.jpg
        '404':
          description: Контакт не знайдено
          content:
            application/json:
              example:
                status: error
                code: 404
                message: Not found

    patch:
      tags:
        - Contacts
      summary: Оновити контакт за ID
      operationId: updateContactById
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                favorite:
                  type: boolean
                photo:
                  type: string
                  format: binary
            encoding:
              photo:
                contentType: image/jpeg
      responses:
        '200':
          description: Контакт оновлено
        '404':
          description: Контакт не знайдено

    delete:
      tags:
        - Contacts
      summary: Видалити контакт за ID
      operationId: deleteContactById
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Контакт видалено
        '404':
          description: Контакт не знайдено

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
