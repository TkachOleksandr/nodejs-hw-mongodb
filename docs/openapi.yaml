openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: REST API для керування контактами з авторизацією, email та зображеннями

tags:
  - name: Contacts
    description: Операції з контактами
  - name: Auth
    description: Операції авторизації

servers:
  - url: http://localhost:3000
  - url: https://nodejs-hw-mongodb-1-lacz.onrender.com

paths:
  /contacts:
    $ref: ../swagger/paths/contacts/index.yaml
  /contacts/{contactId}:
    get:
      $ref: ../swagger/paths/contacts/{id}/get.yaml
    patch:
      $ref: ../swagger/paths/contacts/{id}/patch.yaml
    delete:
      $ref: ../swagger/paths/contacts/{id}/delete.yaml
  /auth/register:
    $ref: ../swagger/paths/auth/register.yaml
  /auth/login:
    $ref: ../swagger/paths/auth/login.yaml
  /auth/logout:
    $ref: ../swagger/paths/auth/logout.yaml
  /auth/refresh:
    $ref: ../swagger/paths/auth/refresh.yaml
  /auth/forgot-password:
    $ref: ../swagger/paths/auth/forgot-password.yaml
  /auth/reset-password:
    $ref: ../swagger/paths/auth/reset-password.yaml

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Contact:
      $ref: ../swagger/components/schemas/Contact.yaml#/Contact
    User:
      $ref: ../swagger/components/schemas/User.yaml#/User
