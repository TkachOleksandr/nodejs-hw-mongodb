openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: REST API для керування контактами з авторизацією, email та зображеннями

tags:
  - name: Auth
    description: Authentication operations
  - name: Contacts
    description: Contact management

servers:
  - url: https://nodejs-hw-mongodb-1-lacz.onrender.com

paths:
  /users/register:
    post:
      $ref: '../swagger/paths/auth/register.yaml'
  /users/login:
    post:
      $ref: '../swagger/paths/auth/login.yaml'
  /users/logout:
    post:
      $ref: '../swagger/paths/auth/logout.yaml'
  /users/current:
    get:
      $ref: '../swagger/paths/auth/current.yaml'
  /contacts:
    get:
      $ref: '../swagger/paths/contacts/get.yaml'
    post:
      $ref: '../swagger/paths/contacts/post.yaml'
  /contacts/{id}:
    get:
      $ref: '../swagger/paths/contacts/{id}/get.yaml'
    patch:
      $ref: '../swagger/paths/contacts/{id}/patch.yaml'
    delete:
      $ref: '../swagger/paths/contacts/{id}/delete.yaml'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Contact:
      $ref: '../swagger/components/schemas/Contact.yaml'
    ContactInput:
      $ref: '../swagger/components/schemas/ContactInput.yaml'
    Error:
      $ref: '../swagger/components/schemas/Error.yaml'
